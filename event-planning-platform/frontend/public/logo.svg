<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Black Sand Events and Creations logo">
  <defs>
    <path id="arcText" d="M 200 355 A 155 155 0 1 1 200.01 355" fill="none"/>
  </defs>
  <circle cx="200" cy="200" r="200" fill="#0b0b0b"/>
  <circle cx="200" cy="200" r="178" fill="none" stroke="#f2e7df" stroke-width="3"/>
  <text font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" letter-spacing="6" fill="#f2e7df">
    <textPath href="#arcText" startOffset="8%">BLACK SAND EVENTS &amp; CREATIONS</textPath>
  </text>
  <!-- BS monogram -->
  <text x="118" y="258" font-family="'Brush Script MT', 'Segoe Script', cursive" font-style="italic" font-size="150" font-weight="700" fill="#f2e7df">B</text>
  <text x="185" y="292" font-family="'Brush Script MT', 'Segoe Script', cursive" font-style="italic" font-size="150" font-weight="700" fill="#f2e7df">S</text>
  <!-- burst rays -->
  <g stroke="#f2e7df" stroke-width="7" stroke-linecap="round">
    <line x1="252" y1="150" x2="256" y2="118"/>
    <line x1="272" y1="160" x2="290" y2="132"/>
    <line x1="286" y1="178" x2="312" y2="162"/>
    <line x1="292" y1="200" x2="322" y2="196"/>
    <line x1="288" y1="222" x2="316" y2="230"/>
  </g>
  <!-- balloon -->
  <ellipse cx="322" cy="128" rx="24" ry="28" fill="#f2e7df"/>
  <path d="M 318 156 q -6 14 4 24 q 10 10 2 24" fill="none" stroke="#f2e7df" stroke-width="4" stroke-linecap="round"/>
</svg>
